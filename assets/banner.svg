<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6522c" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0000fe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradient); }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    
    /* Animations */
    @keyframes pulseWave {
      0% { transform: scaleY(0.95) translateY(5px); opacity: 0.7; }
      50% { transform: scaleY(1.05) translateY(-5px); opacity: 1; }
      100% { transform: scaleY(0.95) translateY(5px); opacity: 0.7; }
    }

    @keyframes moveDash {
      to { stroke-dashoffset: -100; }
    }

    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .animated-wave {
      animation: pulseWave 6s ease-in-out infinite;
      transform-origin: center;
    }

    .dashed-flow {
      stroke-dasharray: 8 6;
      animation: moveDash 8s linear infinite;
    }

    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 7s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 6s ease-in-out infinite 2s; }
    
    .glowing-orb { animation: glowPulse 4s ease-in-out infinite; }

    /* Foreground Typography */
    .title-main {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .title-sub {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #a0aec0;
    }

    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" class="bg" rx="16" />

  <!-- Animated Background Orbs -->
  <circle cx="150" cy="100" r="120" fill="#e6522c" opacity="0.15" class="glowing-orb" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="140" fill="#00f2fe" opacity="0.1" class="glowing-orb" filter="url(#glow)" />

  <!-- Background Grid Lines -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
    
    <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />
  </g>

  <!-- Dynamic Animated Metric Graph Elements (Background Layer) -->
  <g class="animated-wave" opacity="0.7">
    <path d="M 50,340 Q 200,280 350,310 T 650,230 T 950,270 T 1150,180 L 1150,380 L 50,380 Z" fill="url(#chartAreaGrad)" />
    <path d="M 50,340 Q 200,280 350,310 T 650,230 T 950,270 T 1150,180" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" />
  </g>

  <path d="M 50,310 Q 250,350 450,260 T 850,280 T 1150,210" fill="none" stroke="#ff9900" stroke-width="2" class="dashed-flow" opacity="0.6" />

  <!-- Animated Background Tech Pills (Non-Obstructive) -->
  <g class="pill-1" transform="translate(850, 70)">
    <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="6" fill="#e6522c" />
    <text x="36" y="22" class="badge-text">Prometheus Core</text>
  </g>

  <g class="pill-2" transform="translate(980, 140)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="6" fill="#00f2fe" />
    <text x="36" y="22" class="badge-text">VictoriaMetrics</text>
  </g>

  <g class="pill-3" transform="translate(760, 130)">
    <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="20" cy="17" r="6" fill="#ff9900" />
    <text x="36" y="22" class="badge-text">Grafana Mimir</text>
  </g>

  <!-- Foreground Main Card / Banner Content -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Flame Logo Icon -->
    <g transform="translate(0, 15)">
      <rect width="64" height="64" rx="16" fill="url(#accentGradient)" />
      <path d="M32 20 C32 20, 24 30, 24 38 C24 43 27.5 46 32 46 C36.5 46 40 43 40 38 C40 30 32 20 32 20 Z M32 30 C32 30, 35 34, 35 37 C35 39 33.7 40 32 40 C30.3 40 29 39 29 37 C29 34 32 30 32 30 Z" fill="#ffffff"/>
    </g>

    <!-- Category Pill -->
    <rect x="84" y="15" width="230" height="26" rx="13" fill="#e6522c" fill-opacity="0.2" stroke="#e6522c" stroke-width="1" />
    <text x="96" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#ff7a59" letter-spacing="1">AWESOME METRICS LIST</text>

    <!-- Foreground Title & Subtitle (Crisp & Readable) -->
    <text x="84" y="80" class="title-main" filter="url(#shadow)">Managed Monitoring &amp; Metrics</text>
    <text x="84" y="115" class="title-sub">Prometheus Ecosystem, Managed SaaS Platforms &amp; Self-Hosted TSDBs</text>
  </g>

  <!-- Bottom Stats / Tech Pills Bar -->
  <g transform="translate(60, 290)">
    <!-- High Contrast Stat Badges -->
    <g transform="translate(0,0)">
      <rect width="180" height="50" rx="10" fill="#161e2e" stroke="#2d3748" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#718096" font-weight="600">MANAGED SAAS PLATFORMS</text>
      <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="14" fill="#38bdf8" font-weight="700">AWS, Grafana, Datadog +7</text>
    </g>

    <g transform="translate(195,0)">
      <rect width="190" height="50" rx="10" fill="#161e2e" stroke="#2d3748" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#718096" font-weight="600">OPEN SOURCE TSDB &amp; TOOLS</text>
      <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="14" fill="#4ade80" font-weight="700">20+ Top GitHub Repos</text>
    </g>

    <g transform="translate(398,0)">
      <rect width="210" height="50" rx="10" fill="#161e2e" stroke="#2d3748" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#718096" font-weight="600">PRIMARY FOCUS</text>
      <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="14" fill="#f472b6" font-weight="700">PromQL, High Scale, Cost</text>
    </g>
  </g>
</svg>
