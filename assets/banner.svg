<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a102f"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#e6522c"/><stop offset="50%" stop-color="#f90"/><stop offset="100%" stop-color="#ff4500"/></linearGradient><linearGradient id="chartLineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="50%" stop-color="#4facfe" stop-opacity=".9"/><stop offset="100%" stop-color="#0000fe" stop-opacity=".2"/></linearGradient><linearGradient id="chartAreaGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".25"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseWave{0%{transform:scaleY(.95) translateY(5px);opacity:.7}50%{transform:scaleY(1.05) translateY(-5px);opacity:1}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes glowPulse{0%{opacity:.4}50%{opacity:.8}}.bg{fill:url(#bgGradient)}.grid-line{stroke:rgba(255,255,255,.04);stroke-width:1}.animated-wave{animation:pulseWave 6s ease-in-out infinite;transform-origin:center}.dashed-flow{stroke-dasharray:8 6;animation:moveDash 8s linear infinite}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 7s ease-in-out infinite 1s}.pill-3{animation:floatPill 6s ease-in-out infinite 2s}.glowing-orb{animation:glowPulse 4s ease-in-out infinite}.badge-text,.title-main,.title-sub{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-main{font-weight:800;font-size:38px;fill:#fff;letter-spacing:.5px}.title-sub{font-weight:400;font-size:18px;fill:#a0aec0}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="400" class="bg" rx="16"/><circle cx="150" cy="100" r="120" fill="#e6522c" class="glowing-orb" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="300" r="140" fill="#00f2fe" class="glowing-orb" filter="url(#glow)" opacity=".1"/><g><line x1="0" x2="1200" y1="80" y2="80" class="grid-line"/><line x1="0" x2="1200" y1="160" y2="160" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="320" y2="320" class="grid-line"/><line x1="200" x2="200" y1="0" y2="400" class="grid-line"/><line x1="400" x2="400" y1="0" y2="400" class="grid-line"/><line x1="600" x2="600" y1="0" y2="400" class="grid-line"/><line x1="800" x2="800" y1="0" y2="400" class="grid-line"/><line x1="1000" x2="1000" y1="0" y2="400" class="grid-line"/></g><g class="animated-wave" opacity=".7"><path fill="url(#chartAreaGrad)" d="M 50,340 Q 200,280 350,310 T 650,230 T 950,270 T 1150,180 L 1150,380 L 50,380 Z"/><path fill="none" stroke="url(#chartLineGrad)" stroke-width="3" d="M 50,340 Q 200,280 350,310 T 650,230 T 950,270 T 1150,180"/></g><path fill="none" stroke="#f90" stroke-width="2" d="M 50,310 Q 250,350 450,260 T 850,280 T 1150,210" class="dashed-flow" opacity=".6"/><g class="pill-1" transform="translate(850, 70)"><rect width="160" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" rx="17"/><circle cx="20" cy="17" r="6" fill="#e6522c"/><text x="36" y="22" class="badge-text">Prometheus Core</text></g><g class="pill-2" transform="translate(980, 140)"><rect width="170" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" rx="17"/><circle cx="20" cy="17" r="6" fill="#00f2fe"/><text x="36" y="22" class="badge-text">VictoriaMetrics</text></g><g class="pill-3" transform="translate(760, 130)"><rect width="140" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" rx="17"/><circle cx="20" cy="17" r="6" fill="#f90"/><text x="36" y="22" class="badge-text">Grafana Mimir</text></g><g filter="url(#shadow)" transform="translate(60, 60)"><g transform="translate(0, 15)"><rect width="64" height="64" fill="url(#accentGradient)" rx="16"/><path fill="#fff" d="M32 20 C32 20, 24 30, 24 38 C24 43 27.5 46 32 46 C36.5 46 40 43 40 38 C40 30 32 20 32 20 Z M32 30 C32 30, 35 34, 35 37 C35 39 33.7 40 32 40 C30.3 40 29 39 29 37 C29 34 32 30 32 30 Z"/></g><rect width="230" height="26" x="84" y="15" fill="#e6522c" fill-opacity=".2" stroke="#e6522c" stroke-width="1" rx="13"/><text x="96" y="32" fill="#ff7a59" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1">AWESOME METRICS LIST</text><text x="84" y="80" class="title-main" filter="url(#shadow)">Managed Monitoring &amp; Metrics</text><text x="84" y="115" class="title-sub">Prometheus Ecosystem, Managed SaaS Platforms &amp; Self-Hosted TSDBs</text></g><g><g transform="translate(60, 290) translate(0,0)"><rect width="180" height="50" fill="#161e2e" stroke="#2d3748" stroke-width="1" rx="10"/><text x="16" y="24" fill="#718096" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">MANAGED SAAS PLATFORMS</text><text x="16" y="42" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">AWS, Grafana, Datadog +7</text></g><g transform="translate(60, 290) translate(195,0)"><rect width="190" height="50" fill="#161e2e" stroke="#2d3748" stroke-width="1" rx="10"/><text x="16" y="24" fill="#718096" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">OPEN SOURCE TSDB &amp; TOOLS</text><text x="16" y="42" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-si